<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<script>try{var __t=localStorage.getItem("theme");if(__t)document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
<title>نسيت كلمة المرور — Shady Nasr English Platform</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="shared.css?v=20261104" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#f4eee0" />
<style>
  html, body.auth-page { min-height: 100%; }
  body.auth-page { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  .auth-topbar { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-inline: max(14px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .auth-wrap { width: 100%; padding: 16px 14px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
  .auth-card { width: 100%; max-width: 560px; margin-inline: auto; box-sizing: border-box; }
  .auth-card h1 { overflow-wrap: anywhere; }
  #fpForm input, #fpForm button { font-size: 16px; }
  #fpForm .btn { min-height: 52px; width: 100%; }
  #fpForm .form-hint { text-align: center; line-height: 1.8; font-size: 0.8rem; margin: 0; }
  #fpEmail { direction: ltr; text-align: start; }
  @media (max-width: 480px) {
    .auth-card { padding: 22px 16px; border-radius: 20px; }
    .auth-card h1 { font-size: 1.25rem; }
    .brand__text { display: none; }
  }
  @media (max-height: 560px) { .auth-wrap { align-items: flex-start; } }
</style>
</head>
<body class="auth-page">

  <div class="atmosphere">
    <span class="blob-1"></span>
    <span class="blob-2"></span>
    <span class="blob-3"></span>
  </div>

  <header class="auth-topbar">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="shady-nasr-logo.png" alt="Shady Nasr English Platform" />
      <span class="brand__text">
        <span class="brand__name">Shady Nasr</span>
        <span class="brand__tagline">English Platform</span>
      </span>
    </a>
    <div class="auth-topbar__actions">
      <button class="icon-btn theme-btn" id="themeToggle" type="button" aria-label="تغيير المظهر">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card__head">
        <h1>نسيت كلمة المرور؟</h1>
        <p class="modal__subtitle">اكتب اسمك وإيميلك اللي مسجّل بيهم على المنصة، وهنفتحلك رسالة واتساب جاهزة للأدمن عشان يغيّرلك كلمة المرور.</p>
      </div>

      <form class="auth-form" id="fpForm" novalidate style="margin-top:22px;display:grid;gap:16px">
        <div class="form-field">
          <label for="fpName">الاسم المسجّل به</label>
          <input type="text" id="fpName" name="name" dir="rtl" lang="ar" autocomplete="name" placeholder="الاسم بالكامل" />
        </div>
        <div class="form-field">
          <label for="fpEmail">الإيميل المسجّل به</label>
          <input type="email" id="fpEmail" name="email" autocomplete="email" inputmode="email" placeholder="example@gmail.com" />
        </div>
        <p class="form-error" id="fpError" hidden></p>
        <button class="btn btn--accent" type="submit">إرسال عبر واتساب</button>
        <p class="form-hint">بالضغط على إرسال هتفتح رسالة واتساب جاهزة بالتفاصيل اللي كتبتها.</p>
        <a href="login.html" style="text-align:center;color:var(--ink-soft);font-weight:700;font-size:0.85rem">الرجوع لتسجيل الدخول</a>
      </form>
    </div>
  </main>

  <script defer src="shared.js?v=20261112"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof initTheme === "function") { try { initTheme(); } catch (e) {} }

      var WA_NUMBER = "201097221867";
      var form = document.getElementById("fpForm");
      var nameEl = document.getElementById("fpName");
      var emailEl = document.getElementById("fpEmail");
      var errEl = document.getElementById("fpError");

      // لو الطالب كان كاتب إيميله في صفحة الدخول بنملاه تلقائي
      try {
        var q = new URLSearchParams(window.location.search).get("email");
        if (q) emailEl.value = q;
      } catch (e) {}

      function showError(msg) { errEl.textContent = msg || ""; errEl.hidden = !msg; }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        showError("");
        var name = nameEl.value.replace(/\s{2,}/g, " ").trim();
        var email = emailEl.value.trim();
        if (!name) { showError("اكتب اسمك"); nameEl.focus(); return; }
        if (!/^\S+@\S+\.\S+$/.test(email)) { showError("اكتب الإيميل صح"); emailEl.focus(); return; }

        var text = [
          "السلام عليكم، أنا " + name,
          "نسيت كلمة المرور بتاعتي وعايز أغيّرها.",
          "الاسم المسجّل: " + name,
          "الإيميل المسجّل: " + email
        ].join("\n");
        var url = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(text);
        var w = window.open(url, "_blank", "noopener");
        if (!w) window.location.href = url; // لو المتصفح منع النافذة الجديدة
      });
    });
  </script>
</body>
</html>
