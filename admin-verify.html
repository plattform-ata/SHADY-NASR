<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<script>try{var __t=localStorage.getItem("theme");if(__t)document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
<title>تحقق الأدمن — Shady Nasr English Platform</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="shared.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#f4eee0" />
<style>
  /* تجاوب كامل مع الموبايل لصفحة التحقق */
  html, body.auth-page { min-height: 100%; }
  body.auth-page { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  .auth-topbar { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-inline: max(14px, env(safe-area-inset-left, 0px)); gap: 10px; }
  .auth-wrap { width: 100%; padding: 16px 14px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
  .auth-card { width: 100%; max-width: 440px; margin-inline: auto; box-sizing: border-box; }
  .auth-card h1 { overflow-wrap: anywhere; }
  .otp-code { width: 100%; box-sizing: border-box; font-size: 1.6rem; letter-spacing: 0.5em; text-align: center; direction: ltr; }
  #avForm input, #avForm button { font-size: 16px; }
  #avForm .btn { min-height: 46px; }
  .otp-spam-hint { font-size: 0.8rem; line-height: 1.7; }
  @media (max-width: 480px) {
    .auth-card { padding: 22px 16px; border-radius: 20px; }
    .auth-card h1 { font-size: 1.25rem; }
    .brand__text { display: none; }
    .otp-code { font-size: 1.4rem; letter-spacing: 0.4em; }
  }
  @media (max-height: 560px) { .auth-wrap { align-items: flex-start; } }
</style>
</head>
<body class="auth-page">

  <div class="atmosphere">
    <span class="blob-1"></span>
    <span class="blob-2"></span>
    <span class="blob-3"></span>
  </div>

  <header class="auth-topbar">
    <a class="brand" href="index.html">
      <img class="brand__mark brand__mark--dark" src="shady-nasr-logo.png" alt="Shady Nasr English Platform" />
      <img class="brand__mark brand__mark--light" src="shady-nasr-logo.png" alt="Shady Nasr English Platform" />
      <span class="brand__text">
        <span class="brand__name">Shady Nasr</span>
        <span class="brand__tagline">English Platform</span>
      </span>
    </a>
    <div class="auth-topbar__actions">
      <button class="icon-btn theme-btn" id="themeToggle" type="button" aria-label="تغيير المظهر">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card__head">
        <h1>التحقق من هوية الأدمن</h1>
        <p class="modal__subtitle" id="avSubtitle">جاري إرسال كود التحقق…</p>
      </div>

      <form class="auth-form" id="avForm" novalidate style="margin-top:22px;display:grid;gap:14px">
        <div class="form-field">
          <label for="avCode">كود التحقق (6 أرقام)</label>
          <input class="otp-code" id="avCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" />
        </div>
        <p class="form-error" id="avError" hidden></p>
        <button class="btn btn--accent" type="submit" id="avSubmit" style="width:100%;height:46px" disabled>تأكيد ودخول</button>
        <button class="btn btn--ghost" type="button" id="avResend" style="width:100%" disabled>إعادة إرسال الكود</button>
        <p class="otp-spam-hint">لو الكود مجاش خلال دقيقة، شوف فولدر الـ Spam / Junk. الكود صالح لمدة 10 دقايق.</p>
        <a href="login.html" id="avBack" style="text-align:center;color:var(--ink-soft);font-weight:700;font-size:0.85rem">الرجوع لتسجيل الدخول</a>
      </form>
    </div>
  </main>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script defer src="firebase.js"></script>
  <script defer src="shared.js"></script>
  <script>
    /* خطوة التحقق الإضافية للأدمن:
       login.html بيتأكد من الإيميل/الباسورد، ولو الحساب أدمن بيحفظ بيانات مؤقتة في
       sessionStorage ويحوّل هنا. الكود بيتبعت على "إيميل تحقق الأدمن" (adminSettings/verifyEmail)
       اللي بيحدده الأدمن من الإعدادات، ولو مش محدد بيتبعت على إيميل الحساب نفسه. */
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof initTheme === "function") initTheme();

      var PENDING_KEY = "shadynasr-admin-pending";
      var MAX_AGE = 15 * 60 * 1000;
      var pending = null;
      try { pending = JSON.parse(sessionStorage.getItem(PENDING_KEY)); } catch (e) {}
      if (!pending || !pending.email || Date.now() - pending.ts > MAX_AGE) {
        sessionStorage.removeItem(PENDING_KEY);
        window.location.replace("login.html");
        return;
      }

      var $ = function (id) { return document.getElementById(id); };
      var form = $("avForm"), codeEl = $("avCode"), errEl = $("avError");
      var submitBtn = $("avSubmit"), resendBtn = $("avResend"), subtitle = $("avSubtitle");
      var targetEmail = pending.email;
      var cooldownTimer = null;

      function showError(msg) { errEl.textContent = msg || ""; errEl.hidden = !msg; }
      function mask(e) {
        var p = String(e).split("@");
        if (p.length < 2) return e;
        return p[0].slice(0, 2) + "•••@" + p[1];
      }
      function cooldown(sec) {
        resendBtn.disabled = true;
        clearInterval(cooldownTimer);
        var left = sec;
        resendBtn.textContent = "إعادة الإرسال بعد " + left + " ث";
        cooldownTimer = setInterval(function () {
          left--;
          if (left <= 0) {
            clearInterval(cooldownTimer);
            resendBtn.disabled = false;
            resendBtn.textContent = "إعادة إرسال الكود";
          } else {
            resendBtn.textContent = "إعادة الإرسال بعد " + left + " ث";
          }
        }, 1000);
      }

      async function sendCode() {
        showError("");
        subtitle.textContent = "جاري إرسال كود التحقق…";
        try {
          await window.SNAuth.requestOtp(targetEmail, pending.fullName, "admin");
          subtitle.textContent = "اتبعت كود مكوّن من 6 أرقام على الإيميل " + mask(targetEmail);
          submitBtn.disabled = false;
          codeEl.focus();
        } catch (err) {
          subtitle.textContent = "تعذّر إرسال الكود على " + mask(targetEmail);
          submitBtn.disabled = false; // الكود اتخزّن، ممكن يكون الإيميل بس اللي اتأخر
          showError(
            err && err.message === "EMAIL_SEND_FAILED"
              ? "تعذر إرسال الإيميل (راجع إعدادات EmailJS). اضغط إعادة الإرسال."
              : "حصل خطأ أثناء إرسال الكود (راجع صلاحيات Firebase). اضغط إعادة الإرسال."
          );
        }
        cooldown(30);
      }

      async function start() {
        if (!window.SNAuth) { showError("تعذر الاتصال بالخادم، حدّث الصفحة."); return; }
        try {
          var settings = await window.SNAuth.getAdminSettings();
          if (settings && settings.verifyEmail) targetEmail = String(settings.verifyEmail).trim().toLowerCase();
        } catch (e) { /* لو الإعدادات مش متاحة نكمّل بإيميل الحساب */ }
        sendCode();
      }

      resendBtn.addEventListener("click", sendCode);

      codeEl.addEventListener("input", function () {
        codeEl.value = codeEl.value.replace(/\D/g, "").slice(0, 6);
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        showError("");
        var code = codeEl.value.replace(/\D/g, "");
        if (code.length !== 6) { showError("اكتب الكود كامل (6 أرقام)"); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري التحقق...";
        try {
          await window.SNAuth.verifyOtpCode(targetEmail, code);
          var user = await window.SNAuth.findUserByEmail(pending.email);
          if (!user || user.role !== "admin") throw new Error("NOT_ADMIN");
          localStorage.setItem("shadynasr-auth", "1");
          localStorage.setItem("shadynasr-current-user", JSON.stringify({
            id: user.id, fullName: user.fullName, email: user.email, grade: user.grade, role: "admin"
          }));
          sessionStorage.removeItem(PENDING_KEY);
          window.location.replace("admin.html");
        } catch (err) {
          var m = err && err.message;
          showError(
            m === "EXPIRED" ? "الكود منتهي الصلاحية، اضغط إعادة الإرسال"
            : m === "WRONG_CODE" ? "الكود غلط، حاول تاني"
            : m === "NO_OTP" ? "مفيش كود صالح، اضغط إعادة الإرسال"
            : m === "NOT_ADMIN" ? "الحساب ده مش أدمن"
            : "حصل خطأ أثناء التحقق، حاول تاني"
          );
          submitBtn.disabled = false;
          submitBtn.textContent = "تأكيد ودخول";
        }
      });

      $("avBack").addEventListener("click", function () { sessionStorage.removeItem(PENDING_KEY); });

      start();
    });
  </script>
</body>
</html>
