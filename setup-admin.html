<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>إنشاء حساب الأدمن (مرة واحدة)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0f2d35; --brand:#1d5260; --accent:#2c8097; --bg:#f4eee0; --card:#fbf8f0; --err:#b3261e; --ok:#1f7a4d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--ink); font-family:"Tajawal",system-ui,sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border-radius:20px; padding:26px 22px; box-shadow:0 10px 30px rgba(15,45,53,.12); }
  h1 { margin:0 0 6px; font-size:1.3rem; }
  p.sub { margin:0 0 18px; color:#4d6a72; font-size:.9rem; line-height:1.7; }
  label { display:block; margin:12px 0 6px; font-weight:700; font-size:.88rem; }
  input { width:100%; height:46px; padding:0 14px; border:1px solid #cfc8b4; border-radius:12px; background:#fff; font:inherit; font-size:16px; color:var(--ink); }
  input[dir="ltr"] { text-align:left; }
  button { width:100%; height:48px; margin-top:18px; border:0; border-radius:14px; background:var(--brand); color:#fff; font:inherit; font-weight:700; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:.88rem; line-height:1.7; }
  .msg.err { background:#f7e4e2; color:var(--err); }
  .msg.ok { background:#e1f2e9; color:var(--ok); }
  .warn { margin-top:16px; font-size:.8rem; color:#7a5b00; background:#fff3cd; padding:10px 12px; border-radius:10px; line-height:1.7; }
  small { color:#6b7f85; }
</style>
</head>
<body>
  <main class="card">
    <h1>إنشاء حساب الأدمن</h1>
    <p class="sub">الصفحة دي بتكتب حساب الأدمن في Realtime Database بنفس طريقة الموقع (كلمة السر بتتحوّل لـ hash قبل ما تتخزن). تشتغل مرة واحدة بس.</p>

    <form id="f" novalidate>
      <label for="name">الاسم</label>
      <input id="name" type="text" autocomplete="name" placeholder="مثلاً: عبدالله" />

      <label for="email">إيميل الأدمن (للدخول)</label>
      <input id="email" type="email" dir="ltr" autocomplete="username" placeholder="admin@example.com" />

      <label for="pw">كلمة المرور</label>
      <input id="pw" type="password" dir="ltr" autocomplete="new-password" placeholder="6 حروف على الأقل" />

      <label for="vemail">إيميل استلام كود التحقق <small>(اختياري، لو فاضي هيتبعت على إيميل الحساب)</small></label>
      <input id="vemail" type="email" dir="ltr" placeholder="verify@example.com" />

      <button id="go" type="submit" disabled>جاري تحميل الاتصال…</button>
    </form>

    <div id="msg" class="msg" hidden></div>
    <div class="warn">بعد ما الحساب يتعمل: <b>امسح الملف ده من الموقع</b> وارفع الموقع من غيره.</div>
  </main>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script defer src="firebase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var $ = function (id) { return document.getElementById(id); };
      var go = $("go"), msg = $("msg");

      function show(text, ok) { msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "err"); msg.hidden = false; }

      // السكريبتات defer فبنستنى SNAuth يظهر (لحد 8 ثواني)
      var tries = 0;
      var wait = setInterval(function () {
        if (window.SNAuth) {
          clearInterval(wait);
          go.disabled = false;
          go.textContent = "إنشاء حساب الأدمن";
        } else if (++tries > 40) {
          clearInterval(wait);
          go.textContent = "تعذر تحميل firebase.js";
          show("firebase.js مش اتحمّل. افتح Console (F12) وشوف أول خطأ أحمر، وتأكد إنك شاغل الصفحة من Live Server مش بفتح الملف مباشرة.", false);
        }
      }, 200);

      $("f").addEventListener("submit", async function (e) {
        e.preventDefault();
        msg.hidden = true;

        var name = $("name").value.trim();
        var email = $("email").value.trim().toLowerCase();
        var pw = $("pw").value;
        var vemail = $("vemail").value.trim().toLowerCase();

        if (!name) return show("اكتب الاسم", false);
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("الإيميل مش صحيح", false);
        if (pw.length < 6) return show("كلمة المرور لازم تكون 6 حروف على الأقل", false);
        if (vemail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vemail)) return show("إيميل التحقق مش صحيح", false);

        go.disabled = true;
        go.textContent = "جاري الإنشاء…";
        try {
          // أمان: لو فيه أدمن موجود بالفعل نرفض (عشان الصفحة دي ما تتحوّلش لباب خلفي)
          try {
            var all = await SNAuth.fetchAllUsers();
            if (all.some(function (u) { return u && u.role === "admin"; })) {
              throw new Error("ADMIN_EXISTS");
            }
          } catch (chk) {
            if (chk && chk.message === "ADMIN_EXISTS") throw chk;
            // لو القراءة فشلت (قواعد الداتابيز) نكمّل ونسيب الكتابة تحكم
          }

          var passwordHash = await SNAuth.hashPassword(pw);
          var id = SNAuth.emailToKey(email);

          await SNAuth.commitRegistration({
            id: id,
            fullName: name,
            email: email,
            passwordHash: passwordHash,
            role: "admin",
            points: 0,
            emailVerified: true
          });

          if (vemail) {
            try { await SNAuth.saveAdminSettings({ verifyEmail: vemail }); } catch (e2) {}
          }

          show("تم إنشاء الأدمن ✅  دلوقتي ادخل من login.html بالإيميل وكلمة المرور دي، وبعدها امسح setup-admin.html.", true);
          go.textContent = "تم";
        } catch (err) {
          var m = err && err.message;
          var text =
            m === "ADMIN_EXISTS" ? "فيه حساب أدمن موجود بالفعل في الداتابيز. لو نسيت كلمة السر امسح العقدة من Firebase Console وجرّب تاني."
            : m === "EMAIL_EXISTS" ? "الإيميل ده موجود بالفعل كحساب. امسحه من Firebase Console (Realtime Database ← users) وجرّب تاني."
            : /permission[_ ]denied/i.test(String(m)) ? "قواعد Firebase (Rules) رافضة الكتابة. افتح Realtime Database ← Rules وخلّي الكتابة مسموحة مؤقتًا، أو استخدم طريقة الاستيراد اليدوي."
            : "حصل خطأ: " + (m || "غير معروف") + " (افتح Console للتفاصيل)";
          console.error("[setup-admin]", err);
          show(text, false);
          go.disabled = false;
          go.textContent = "إنشاء حساب الأدمن";
        }
      });
    });
  </script>
</body>
</html>
